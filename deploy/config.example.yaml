# StarData 服务配置
# 复制此文件为 config.yaml 并按需修改
#
# 配置优先级: 环境变量 > config.yaml > 默认值
# 环境变量前缀: STARDATA_ (如 STARDATA_HTTP_PORT=8080)
---
server:
  # HTTP 服务端口 (前端 UI + REST API)
  http_port: 9080

  # gRPC 服务端口 (内部查询接口)
  grpc_port: 9090

  # 外部访问地址 (用于 OIDC 回调、分享链接等)
  external_url: "http://localhost:9080"

auth:
  # 认证方式: local | oidc | jwt
  #   local — 本地用户名/密码认证 (默认)
  #   oidc  — 企业 OIDC SSO (Keycloak / Authing / 自建)
  #   jwt   — 仅验证 JWT Token (对接已有认证系统)
  provider: local

  # JWT 签名密钥 (必填, 建议 32+ 字节随机字符串)
  jwt_secret: "change-me-to-a-random-secret-at-least-32-chars"

  # OIDC 配置 (仅 provider=oidc 时生效)
  oidc:
    # OIDC Issuer URL (如 https://auth.company.com/realms/stardata)
    issuer_url: ""
    # OIDC Client ID
    client_id: "stardata"
    # OIDC Client Secret
    client_secret: ""
    # 可选: OIDC 范围 (默认 "openid profile email")
    scopes: "openid profile email"

  # 本地用户配置 (仅 provider=local 时生效)
  local_users:
    - username: admin
      # 密码 bcrypt 哈希 (可用 htpasswd 或在线工具生成)
      password_hash: "$2a$10$..."
      role: admin
    - username: viewer
      password_hash: "$2a$10$..."
      role: viewer

database:
  # 元数据存储: duckdb | postgres | sqlite
  #   duckdb  — 适合单机/小团队 (文件存储)
  #   postgres — 生产环境推荐 (需独立 PostgreSQL)
  #   sqlite   — 极简部署
  connector: duckdb

  # 数据库路径 (duckdb/sqlite 时生效)
  path: /data/stardata/catalog.db

  # PostgreSQL 连接串 (connector=postgres 时生效)
  dsn: "postgres://stardata:password@localhost:5432/stardata?sslmode=disable"

olap:
  # 默认 OLAP 引擎: duckdb | clickhouse
  #   duckdb    — 默认, 零配置, 适合小规模数据
  #   clickhouse — 生产环境推荐, 支持大规模数据
  default_connector: duckdb

  # ClickHouse 连接配置
  clickhouse:
    dsn: "clickhouse://localhost:9000"
    username: stardata
    password: "changeme"
    database: stardata

storage:
  # 存储后端: local | s3 | minio
  #   local — 本地文件存储 (默认)
  #   s3    — AWS S3 或兼容对象存储
  #   minio — MinIO 对象存储
  type: local

  # 本地存储路径 (type=local 时生效)
  path: /data/storage

  # S3/MinIO 配置 (type=s3/minio 时生效)
  # s3:
  #   bucket: stardata-storage
  #   region: cn-north-1
  #   endpoint: https://s3.amazonaws.com
  #   access_key_id: ""
  #   secret_access_key: ""

ai:
  # AI Provider (deepseek | openai | qwen | custom)
  #   deepseek — DeepSeek API (默认, 中文能力强)
  #   openai   — OpenAI API (GPT-4o 等)
  #   qwen     — 通义千问 API
  #   custom   — 兼容 OpenAI API 的私有模型
  provider: deepseek

  # API Key (建议通过环境变量 STARDATA_AI_API_KEY 传入)
  api_key: ""

  # API Base URL (custom provider 时必填)
  api_base: "https://api.deepseek.com/v1"

  # 模型名称
  model: "deepseek-chat"

  # 最大 Token 数
  max_tokens: 4096

  # 温度参数 (0.0-2.0, 默认 0.7)
  temperature: 0.7

logging:
  # 日志级别: debug | info | warn | error
  level: info

  # 日志格式: text | json
  format: text

# 多租户配置 (可选)
# tenant:
#   mode: single        # single | multi
#   default_tenant: default
