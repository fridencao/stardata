# StarData Admin 管理平面 — 私有化部署编排
# 用法: docker compose --env-file .env.admin -f docker-compose.admin.yml up -d
#
# 启动顺序：postgres(健康) → keycloak(导入 realm + 健康) → stardata-admin(migrate && start)
# 关键：
#   1. stardata admin start 不会自动迁移数据库，必须先用 `stardata admin migrate` 建表。
#   2. Keycloak 必须先就绪，因为 admin 启动时同步执行 OIDC discovery（oidc.NewProvider）。

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stardata
      POSTGRES_PASSWORD: "${STARDATA_DB_PASSWORD:-changeme}"
      POSTGRES_DB: stardata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stardata"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # 发布到宿主 8081，使浏览器可直达 Keycloak 登录页。
    # issuer 固定为 http://localhost:8081/realms/stardata：
    #   - 浏览器走 localhost:8081（直连已发布端口，不依赖任何 DNS / DoH，绝对可达）；
    #   - admin 容器经下方 extra_hosts 把 localhost 指向宿主网关(host-gateway)，同样可达 8081。
    # 二者 issuer 一致，token 的 iss 校验才能通过。
    # 注：早期用 host.docker.internal 因 Docker 内部 DNS 代理在睡眠/闲置后失联(返回 502/503)，
    #     故改为 localhost，浏览器与容器均稳定可达。
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/stardata
      KC_DB_USERNAME: stardata
      KC_DB_PASSWORD: "${STARDATA_DB_PASSWORD:-changeme}"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8081"
      KC_HOSTNAME_SCHEME: http
      # Keycloak 25 reads KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD (KC_BOOTSTRAP_* is 26+).
      # Both are set so the bootstrap admin survives an image upgrade.
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # StarData brand login theme (extends built-in "keycloak" theme)
      - ./keycloak/themes/stardata:/opt/keycloak/themes/stardata:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 25 镜像基于 RHEL 9：bash 未编译 /dev/tcp，且镜像内无 curl/wget/nc/python。
      # 故用纯 bash 解析内核监听表 /proc/net/tcp(tcp6)（state 0A = LISTEN）来判定端口就绪：
      #   8080(0x1F90) = 主 OIDC 端口，admin 启动需对其做 OIDC discovery；
      #   9000(0x2328) = 管理/健康端口（KC_HEALTH_ENABLED 开启后监听）。
      # 二者均进入 LISTEN 即认为 Keycloak 已就绪，足以放开 depends_on 闸门。
      test: ["CMD", "bash", "-c", "grep -qE ':1F90 .* 0A ' /proc/net/tcp /proc/net/tcp6 && grep -qE ':2328 .* 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 20

  stardata-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    restart: unless-stopped
    env_file:
      - .env.admin
    # 让容器内 localhost 指向宿主网关，使 admin 启动时对 http://localhost:8081 的 OIDC discovery
    # 能经已发布端口到达 keycloak（与浏览器使用同一 issuer，iss 校验一致）。
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${RILL_ADMIN_EXTERNAL_PORT:-8080}:8080"
    volumes:
      # 本地 assets 存储（RILL_ADMIN_ASSETS_DIR=/data/assets）
      - admin_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # 关键：先 migrate（建表）再 start。start 不会自动迁移。
    command: ["sh", "-c", "stardata admin migrate && stardata admin start"]

  # runtime 数据面：复用 admin 同一镜像，负责项目部署（下载 archive、reconcile）、
  # dashboard 查询与 ChatBI。浏览器直连宿主 8090 访问（CSP dev 分支已放行 localhost:*）。
  stardata-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    restart: unless-stopped
    environment:
      RILL_RUNTIME_METASTORE_URL: /data/metastore.db
      RILL_RUNTIME_DATA_DIR: /data
      RILL_RUNTIME_HTTP_PORT: "8090"
      RILL_RUNTIME_GRPC_PORT: "8090"
      RILL_RUNTIME_DEBUG_PORT: "0"
      RILL_RUNTIME_ALLOWED_ORIGINS: "*"
      RILL_RUNTIME_AUTH_ENABLE: "true"
      # issuer = admin 的 ExternalURL（JWT iss），JWKS 经 nginx /.well-known/ 反代可达
      RILL_RUNTIME_AUTH_ISSUER_URL: "http://localhost"
      # audience 必须与 provisioner spec 中的 audience_url 严格一致
      RILL_RUNTIME_AUTH_AUDIENCE_URL: "http://localhost:8090"
      RILL_RUNTIME_SESSION_KEY_PAIRS: "${RILL_ADMIN_SESSION_KEY_PAIRS:-}"
    # 容器内 localhost 指向宿主网关：admin 下发的 asset 下载 URL（http://localhost/...）
    # 与 JWKS 地址均经宿主 nginx 可达。
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      # DuckDB 数据 + sqlite metastore 持久化
      - runtime_data:/data
    depends_on:
      - stardata-admin
    command: ["stardata", "runtime", "start"]

  # web-admin 静态前端（Phase 2 接入）：node 构建 -> nginx 托管，容器内部监听 3002，
  # 由下方 nginx 单源反代以 / 暴露。构建时通过 build args 注入 RILL_UI_PUBLIC_RILL_ADMIN_URL 等。
  web-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web-admin
      args:
        RILL_UI_PUBLIC_RILL_ADMIN_URL: "${RILL_UI_PUBLIC_RILL_ADMIN_URL:-http://localhost:8080}"
        RILL_ADMIN_FRONTEND_URL: "${RILL_ADMIN_FRONTEND_URL:-http://localhost:3002}"
    restart: unless-stopped
    expose:
      - "3002"
    depends_on:
      - stardata-admin

  # 可选单源反代（推荐部署形态）：将 / 指向 web-admin、/v1 指向 admin，规避 CORS 与 cookie 域问题。
  # 启用：docker compose --env-file .env.admin -f docker-compose.admin.yml --profile proxy up -d
  # 说明：web-admin 服务已在上方接入，nginx 反代 / -> web-admin:3002、/v1 -> stardata-admin:8080。
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/admin-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - stardata-admin
      - web-admin

volumes:
  pg_data:
  admin_data:
  runtime_data:
