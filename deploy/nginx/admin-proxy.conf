# StarData 单源反代：/v1 → admin API，/ → web-admin 静态
# 启用后 Cookie 同域，可规避 CORS 与 cookie 域问题。
# web-admin 服务在 Phase 2 完成后接入（compose 中加一个 build web-admin 的服务即可）。

upstream admin_upstream {
    server stardata-admin:8080;
}

upstream webadmin_upstream {
    # Phase 2 接入：web-admin 服务名（默认 :3002）
    server web-admin:3002;
}

server {
    listen 80;
    server_name _;

    # 管理 API
    location /v1/ {
        # 项目 archive（tar.gz）经此上传到 admin 本地 asset 存储，默认 1m 会 413
        client_max_body_size 200m;
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC 登录/登出回调（admin 的 /auth/* 端点，web-admin 登录走这里）
    location /auth/ {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin 自身 JWKS / OIDC 元数据（runtime/CLI 校验用）
    location /.well-known/ {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端（web-admin）
    location / {
        proxy_pass http://webadmin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
