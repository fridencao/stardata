# web-admin 静态前端（容器内部监听 3002，供 admin-proxy 反代 / -> web-admin:3002）
server {
    listen 3002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：adapter-static 以 index.html 作为 fallback，未匹配静态资源时回到入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物（content-hashed）长缓存
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
