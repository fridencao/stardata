# StarData Nginx 反向代理配置
# 用途: SSL termination + HTTP/2 + 请求转发
#
# 用法:
#   1. 放置 SSL 证书到 ssl/ 目录:
#      - ssl/stardata.crt
#      - ssl/stardata.key
#   2. 根据实际域名修改 server_name
#   3. 重载: docker exec stardata-nginx nginx -s reload
#

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name star-data.company.com;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name star-data.company.com;

    # SSL 配置
    ssl_certificate     /etc/nginx/ssl/stardata.crt;
    ssl_certificate_key /etc/nginx/ssl/stardata.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求大小限制 (防止大查询导致 OOM)
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 静态资源缓存 (前端构建产物)
    location /_app/ {
        proxy_pass http://stardata:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, immutable, max-age=86400";
    }

    # API 请求 (不缓存)
    location /v1/ {
        proxy_pass http://stardata:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应支持 (AI 对话 SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # WebSocket 支持 (stardata start 的实时通信)
    location /ws/ {
        proxy_pass http://stardata:9080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # gRPC-web 端点
    location /grpc/ {
        proxy_pass http://stardata:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/grpc-web+proto;
        proxy_read_timeout 300s;
    }

    # 默认路由 — 前端 SPA (所有路径渲染 index.html)
    location / {
        proxy_pass http://stardata:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA 不需要缓存 HTML
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 访问日志
    access_log /var/log/nginx/stardata_access.log;
    error_log  /var/log/nginx/stardata_error.log;
}
